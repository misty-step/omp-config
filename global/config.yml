defaultThinkingLevel: auto
advisor: 
  enabled: true
  subagents: false
memory: 
  backend: mnemopi
compaction: 
  strategy: snapcompact
  idleEnabled: true
  idleThresholdTokens: 200000
snapcompact: 
  systemPrompt: agents-md
lsp: 
  enabled: true
  formatOnWrite: false
  diagnosticsOnEdit: true
skills: 
  enabled: true
symbolPreset: nerd
theme: 
  dark: kanagawa
  light: kanagawa-lotus
setupVersion: 1
statusLine: 
  preset: custom
  sessionAccent: true
  compactThinkingLevel: false
  showHookStatus: true
  leftSegments: 
    []
  rightSegments: 
    []
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 44
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
    time: 
      format: 24h
      showSeconds: false
display: 
  shimmer: classic
  showTokenUsage: true
tui: 
  chrome: plain
  textSizing: false
grep: 
  enabled: true
async: 
  enabled: true
task: 
  eager: preferred
  batch: true
  enableLsp: true
  maxConcurrency: 12
  maxRuntimeMs: 2700000
  maxRecursionDepth: 2
  isolation: 
    mode: auto
checkpoint: 
  enabled: true
autolearn: 
  enabled: true
bash: 
  autoBackground: 
    enabled: true
github: 
  enabled: true
autoResume: true
dev: 
  autoqaConsent: granted