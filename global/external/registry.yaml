# OMP external skill registry — vendored sources, pinned.
#
# Each source is vendored into `global/external/<vendor_dir>/` at its
# immutable commit. The committed payload and `.sync-meta.json` receipt are
# the reviewable import; bin/check rejects registry/receipt/directory drift.
# Editing a vendored external makes it a fork — mark it here and stop syncing.
#
# Schema (per source):
#   repo, ref, pin, skills_path, layout, skill_name/include, alias_prefix
#   vendor_dir: committed directory containing the receipt and payload
#   license/license_path: redistribution terms mirrored by the receipt
#   consumers: repository-relative live paths that use the imported payload
#
# Every non-default source declares alias_prefix. A source's vendor_dir is
# checked one-for-one against this file; receipts pin every payload and license
# byte. Consumers are paths, not aspirational catalog notes.

sources:
  - repo: misty-step/harness-kit
    default: true
    layout: flat
    skills_path: skills

  - repo: misty-step/aesthetic
    ref: 0d4cf9a4a7b50fab5e00491daab35fa8cbef93ce
    pin: 0d4cf9a4a7b50fab5e00491daab35fa8cbef93ce
    vendor_dir: misty-aesthetic
    layout: root
    skills_path: "."
    skill_name: aesthetic
    alias_prefix: "misty-"
    license: MIT
    license_path: LICENSE
    consumers:
      - global/skills/factory-apps/SKILL.md

  - repo: misty-step/canary
