defaultThinkingLevel: auto
advisor: 
  enabled: true
  subagents: false
memory: 
  backend: "off"
compaction: 
  strategy: snapcompact
  idleEnabled: true
  idleThresholdTokens: 200000
snapcompact: 
  systemPrompt: agents-md
lsp: 
  enabled: true
  formatOnWrite: false
  diagnosticsOnEdit: true
skills: 
  enabled: true
symbolPreset: nerd
theme: 
  dark: dark-ember
  light: light-ember
setupVersion: 1
statusLine: 
  preset: custom
  separator: slash
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments: 
    - session_name
    - model
    - mode
    - path
    - git
  rightSegments: 
    - subagents
    - token_rate
    - context_pct
    - time_spent
  segmentOptions: 
    model: 
      showThinkingLevel: true
    path: 
      abbreviate: true
      maxLength: 42
      stripWorkPrefix: true
    git: 
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
    time: 
      format: 24h
      showSeconds: false
display: 
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
terminal: 
  showImages: true
  showProgress: true
tui: 
  chrome: plain
  textSizing: false
  titleState: true
  hyperlinks: auto
grep: 
  enabled: true
async: 
  enabled: true
task: 
  eager: preferred
  batch: true
  enableLsp: true
  maxConcurrency: 12
  maxRuntimeMs: 2700000
  maxRecursionDepth: 2
  disabledAgents: 
    - task
    - scout
    - librarian
    - sonic
    - reviewer
    - security-reviewer
  isolation: 
    mode: auto
checkpoint: 
  enabled: true
autolearn: 
  enabled: false
bash: 
  autoBackground: 
    enabled: true
github: 
  enabled: true
autoResume: true
dev: 
  autoqaConsent: granted
browser: 
  relay: false
