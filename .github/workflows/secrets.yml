name: Secret scanning

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          path: ./
          version: 3.95.8
          extra_args: --results=verified --fail-on-scan-errors
