# OpenRouter egress uses the Mint service on the tailnet:
# http://mint.tail5f5eb4.ts.net:4949, host `mint`.
# Mint performs no caller authentication or authorization. Tailnet reachability is the network boundary.
# The client carries only the value-free marker below. Mint replaces it in the request header.
# No local credential bytes enter this configuration.
providers:
  openrouter:
    baseUrl: "http://mint.tail5f5eb4.ts.net:4949/proxy/https/openrouter.ai/api/v1"
    apiKey: "__mint.openrouter.default__"
  ollama:
    baseUrl: "http://127.0.0.1:11434"
    auth: none
    api: openai-responses
    discovery:
      type: ollama
