modelRoles: 
  default: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:max
  plan: "@slow"
  advisor: "@default"
  task: cursor/composer-2.5
  designer: "@slow"
  vision: openrouter/google/gemini-3.7-flash:high
  smol: cursor/composer-2.5
  tiny: "@smol"
  commit: "@smol"
symbolPreset: nerd
theme:
  dark: tokyonight
  light: tokyonight
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - cache_hit
    - context_pct
    - cost
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 36
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: false
setupVersion: 1
skills: 
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
advisor: 
  enabled: true
providers:
  tinyModel: lfm2-350m
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    openai-codex/gpt-5.6-sol:
      - cursor/gpt-5.6-sol-high
      - anthropic/claude-fable-5:high
      - cursor/claude-fable-5-high
      - xai-oauth/grok-4.6:xhigh
      - openrouter/deepseek/deepseek-v4-pro-0813:max
    google-antigravity/gemini-3.7-flash:
      - cursor/composer-2.5
      - cursor/cursor-grok-4.6-high
      - xai-oauth/grok-4.6:xhigh
      - cursor/gemini-3.7-flash-high
      - openrouter/deepseek/deepseek-v4-pro-0813:max
    openai-codex/gpt-5.6-luna:
      - cursor/composer-2.5
      - cursor/gpt-5.6-luna-high
      - xai-oauth/grok-4.6:xhigh
      - openrouter/~deepseek/deepseek-v4-flash-latest:max
    cursor/composer-2.5:
      - cursor/cursor-grok-4.6-high
      - xai-oauth/grok-4.6:high
      - openrouter/~deepseek/deepseek-v4-flash-latest:max
    cursor/gpt-5.6-sol-high:
      - anthropic/claude-fable-5:high
      - xai-oauth/grok-4.6:xhigh
      - openrouter/deepseek/deepseek-v4-pro-0813:max
    cursor/gpt-5.6-sol-max:
      - cursor/claude-fable-5-max
      - xai-oauth/grok-4.6:xhigh
      - openrouter/deepseek/deepseek-v4-pro-0813:max
task:
  enableLsp: true
  agentModelOverrides:
    security-reviewer: "@slow"
