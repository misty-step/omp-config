name: omp-hatchet-canary

services:
  postgres:
    image: postgres:15.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: hatchet
      POSTGRES_USER: hatchet
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - hatchet-postgres:/var/lib/postgresql/data

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite-dev:v0.94.10
    restart: unless-stopped
    command: ["/quiet-entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://hatchet@postgres:5432/hatchet?sslmode=disable
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_URL: http://localhost:8888
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8733/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:7077:7077"
    volumes:
      - ./scripts/quiet-entrypoint.sh:/quiet-entrypoint.sh:ro
      - ./local/hatchet-config:/config

volumes:
  hatchet-postgres:
    name: omp-hatchet-postgres-v09410
