modelRoles:
  default: google-antigravity/gemini-3.8-flash:high
  slow: openai-codex/gpt-6-astra:max
  plan: openai-codex/gpt-6-astra:max
  advisor: openai-codex/gpt-6-astra:high
  task: google-antigravity/gemini-3.8-flash:high
  designer: openai-codex/gpt-6-astra:max
  reviewer: openai-codex/gpt-6-astra:high
  security-reviewer: openai-codex/gpt-6-astra:max
  vision: google-antigravity/gemini-3.8-flash:high
  smol: google-antigravity/gemini-3.8-flash:high
  tiny: google-antigravity/gemini-3.8-flash:high
  commit: google-antigravity/gemini-3.8-flash:high
symbolPreset: nerd
theme:
  dark: tokyonight
  light: everforest-light
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: false
  leftSegments:
    - model
    - mode
    - git
    - status
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: true
  headless: true
  cmux: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
tools:
  approvalMode: yolo
advisor:
  enabled: true
  syncBacklog: "off"
providers:
  tinyModel: lfm2-350m
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    default:
      - openai-codex/gpt-6-astra:high
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - openrouter/deepseek/deepseek-v4.1-flash:max
    slow:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    plan:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    advisor:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    task:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    designer:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    vision:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    reviewer:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    security-reviewer:
      - xai-oauth/grok-4.6:xhigh
      - anthropic/claude-opus-5:max
      - google-antigravity/gemini-3.8-flash:high
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    smol:
      - xai-oauth/grok-4.6:low
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    tiny:
      - xai-oauth/grok-4.6:low
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
    commit:
      - xai-oauth/grok-4.6:low
      - anthropic/claude-sonnet-5:low
      - openai-codex/gpt-6-astra:low
      - openrouter/deepseek/deepseek-v4.1-flash:max
task:
  maxRecursionDepth: 3
  showResolvedModelBadge: true
  enableLsp: true
  isolation:
    enabled: true
    apply: true
    merge: patch
  agentModelOverrides:
    task: "@task"
    scout: "@smol"
    sonic: "@smol"
    designer: "@designer"
    reviewer: "@reviewer"
    security-reviewer: "@security-reviewer"
isolation:
  backend: auto
