# OpenRouter egress is brokered by the Mint service on the tailnet
# (http://mint.tail5f5eb4.ts.net:4949, host `mint`, Tailnet WhoIs auth).
# The client carries only the value-free placeholder below.
# Mint's policy injects the real key at the upstream boundary.
# No local credential bytes enter this configuration.
providers:
  openrouter:
    baseUrl: "http://mint.tail5f5eb4.ts.net:4949/proxy/https/openrouter.ai/api/v1"
    apiKey: "__mint.openrouter.default__"
