modelRoles:
  default: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:max
  plan: "@slow"
  advisor: "@default"
  task: openai-codex/gpt-5.6-luna:max
  designer: kimi-code/k3:max
  vision: google-antigravity/gemini-3.7-flash:high
  smol: cursor/composer-2.5
  tiny: "@smol"
  commit: "@smol"
symbolPreset: nerd
theme:
  dark: light-gruvbox
  light: light-gruvbox
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - model
    - mode
    - path
    - git
    - pr
    - subagents
  rightSegments:
    - session_name
    - cache_hit
    - context_pct
    - cost
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 36
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
  enabled: true
secrets:
  enabled: true
advisor:
  enabled: true
providers:
  tinyModel: lfm2-350m
  webSearchOrder:
    - exa
retry:
  fallbackChains:
    default:
      - cursor/gpt-5.6-sol:max
      - anthropic/claude-fable-5:max
      - xai-oauth/grok-4.6:xhigh
