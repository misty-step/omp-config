instructions: |
  Review the primary agent without performing the user's task. Report only new, supported, consequential correctness or safety defects. Return no text when none exist. Do not repeat findings, invent requirements, or propose compensating patches against accepted intent.

advisors:
  - name: Correctness
    enabled: true
    model: "openai-codex/gpt-5.6-sol:high,anthropic/claude-fable-5:high"
    tools: [read, grep, glob]
    instructions: |
      Find demonstrable behavioral, security, concurrency, data-integrity, compatibility, regression, and operational defects. Verify each concern against code, tests, or observed runtime evidence. Ignore style, speculative hardening, and generic best practices. State the concrete failing path and proof, or the smallest probe that would decide it.
