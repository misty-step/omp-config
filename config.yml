symbolPreset: nerd
theme:
  dark: tokyonight
  light: everforest-light
statusLine:
  preset: custom
  separator: none
  transparent: true
  sessionAccent: true
  compactThinkingLevel: true
  showHookStatus: true
  leftSegments:
    - hostname
    - model
    - mode
    - git
    - subagents
  rightSegments:
    - session_name
    - context_pct
    - cost
  segmentOptions:
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
tui:
  tight: false
  hyperlinks: auto
  renderMermaid: true
  scrollbackRebuild: true
  titleState: true
display:
  shimmer: classic
  smoothStreaming: true
  showTokenUsage: true
  cacheMissMarker: true
browser:
  relay: false
  headless: true
  cmux: false
setupVersion: 2
composer:
  shape: pi
skills:
  enableAgentsUser: true
github:
